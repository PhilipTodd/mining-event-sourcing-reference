title: Reference Project
description: Concise technical documentation for a reference application - architecture, decisions, operations, and a live demo.
lang: en
encoding: utf-8

# Set these per repository when publishing to GitHub Pages.
# Project site example: url: "https://username.github.io"  baseurl: "/repo-name"
url: ""
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

permalink: pretty
highlighter: rouge

# Custom layouts in this repo override Minima. Do not set `theme:`.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .gitignore
  - .github

defaults:
  - scope:
      path: ""
    values:
      layout: page
      hide_sidebar: false

# ---------------------------------------------------------------------------
# Per-project settings. Copy this file into each documentation site and edit.
# ---------------------------------------------------------------------------
project:
  name: Reference Project
  short_name: RefProj
  tagline: Production-shaped software, documented for a hiring conversation.
  # The Pitch: 2-3 sentences on the "Why."
  pitch: >
    Hiring managers should understand the problem in under ten seconds.
    This template is the shared look and feel for three reference projects -
    swap the pitch, demo URL, credentials, and hero images per build.
  demo:
    url: "https://example.com"
    label: Open live demo
  credentials:
    enabled: true
    username: demo.user
    password: ChangeMe!
    notes: Read-only sample account. Do not enter real data.
  github:
    repo: "https://github.com/example/reference-project"
    issues: "https://github.com/example/reference-project/issues"
  images:
    landscape: /assets/images/hero-landscape.svg
    portrait: /assets/images/hero-portrait.svg
    alt: Product screenshot placeholder
  facts:
    - label: Platform
      value: Azure
    - label: IaC
      value: Bicep
    - label: CI/CD
      value: GitHub Actions
    - label: Branching
      value: GitHub Flow

author:
  name: Philip
  url: ""
