---
layout: default
---
<article class="doc">
  <header class="doc__header">
    {% if page.eyebrow %}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="lede">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="doc__body">
    {{ content }}
  </div>
</article>
