<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="layout{% if page.layout == 'home' or page.hide_sidebar %} layout--home{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <div class="shell">
      {% unless page.layout == 'home' or page.hide_sidebar %}
        {% include sidebar.html %}
      {% endunless %}
      <div class="main-wrap">
        <main id="main" class="main" tabindex="-1">
          {{ content }}
        </main>
        {% include footer.html %}
      </div>
    </div>
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
