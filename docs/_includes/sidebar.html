<aside class="sidebar" id="site-sidebar">
  <nav class="sidebar__nav" aria-label="Documentation">
    <p class="sidebar__label">Documentation</p>
    <ul>
      {% for item in site.data.navigation.primary %}
        {% assign item_url = item.url | relative_url %}
        {% assign page_url = page.url | relative_url %}
        <li>
          <a href="{{ item_url }}"{% if page_url == item_url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</aside>
<div class="sidebar-backdrop" data-nav-backdrop hidden></div>
