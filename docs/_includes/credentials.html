<div class="credentials" data-credentials>
  <div class="credentials__head">
    <p class="credentials__title">Demo login</p>
    {% if site.project.credentials.notes %}
      <p class="credentials__notes">{{ site.project.credentials.notes }}</p>
    {% endif %}
  </div>
  <dl class="credentials__grid">
    <div>
      <dt>Username</dt>
      <dd>
        <code>{{ site.project.credentials.username }}</code>
        <button type="button" class="btn btn--tiny" data-copy="{{ site.project.credentials.username }}">Copy</button>
      </dd>
    </div>
    <div>
      <dt>Password</dt>
      <dd>
        <code>{{ site.project.credentials.password }}</code>
        <button type="button" class="btn btn--tiny" data-copy="{{ site.project.credentials.password }}">Copy</button>
      </dd>
    </div>
  </dl>
</div>
