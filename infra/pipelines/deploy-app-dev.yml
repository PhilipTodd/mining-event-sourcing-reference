name: deploy-event-sourcing-app-dev-$(Date:yyyyMMdd)-$(Rev:r)

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-esr-dev'

  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.x'

  applicationTestsProject: 'tests/BlastPlanning.Application.Tests/BlastPlanning.Application.Tests.csproj'
  domainTestsProject: 'tests/BlastPlanning.Domain.Tests/BlastPlanning.Domain.Tests.csproj'
  
  apiProject: 'src/backend/services/blast-planning/BlastPlanning.Api/BlastPlanning.Api.csproj'
  apiAppName: 'api-adt-blastplanning-dev'
  apiPublishDirectory: '$(Build.ArtifactStagingDirectory)/api/publish'
  apiPackagePath: '$(Build.ArtifactStagingDirectory)/api/api.zip'
  
  functionProject: 'src/backend/functions/BlastPlanning.ProjectionFunction/BlastPlanning.ProjectionFunction.csproj'
  functionAppName: 'func-adt-blastplanning-dev'
  functionPublishDirectory: '$(Build.ArtifactStagingDirectory)/function/publish'
  functionPackagePath: '$(Build.ArtifactStagingDirectory)/function/function.zip'


  # workerPublishDirectory: '$(Build.ArtifactStagingDirectory)/worker/publish'
  # workerPackageRoot: '$(Build.ArtifactStagingDirectory)/worker/package'
  # workerPackagePath: '$(Build.ArtifactStagingDirectory)/worker/worker.zip'

stages:

  # ==========================================================================
  # Build and test
  # ==========================================================================

  - stage: Build
    displayName: Build and test

    jobs:
      - job: BuildApplications
        displayName: Build API and projection worker

        steps:
          - checkout: self
            clean: true

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: '$(dotnetSdkVersion)'

          - script: |
              dotnet --info
            displayName: Show .NET environment

          - script: |
              dotnet restore "$(apiProject)"
              dotnet restore "$(functionProject)"
            displayName: Restore dependencies

          - script: |
              dotnet build "$(apiProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore

              dotnet build "$(functionProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore
            displayName: Build applications

          - script: |
              set -euo pipefail
          
              dotnet test "$(applicationTestsProject)" \
                --configuration "$(buildConfiguration)" \
                --logger "trx" \
                --results-directory "$(Agent.TempDirectory)/TestResults"
          
              dotnet test "$(domainTestsProject)" \
                --configuration "$(buildConfiguration)" \
                --logger "trx" \
                --results-directory "$(Agent.TempDirectory)/TestResults"
          
            displayName: Run Application and Domain tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              failTaskOnFailedTests: true

          # ------------------------------------------------------------------
          # Publish API
          # ------------------------------------------------------------------

          - script: |
              set -euo pipefail

              rm -rf "$(apiPublishDirectory)"
              mkdir -p "$(apiPublishDirectory)"

              dotnet publish "$(apiProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore \
                --output "$(apiPublishDirectory)"
            displayName: Publish API

          - task: ArchiveFiles@2
            displayName: Package API
            inputs:
              rootFolderOrFile: '$(apiPublishDirectory)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(apiPackagePath)'
              replaceExistingArchive: true

          # ------------------------------------------------------------------
          # Publish projection worker as continuous WebJob
          # ------------------------------------------------------------------

          - script: |
              set -euo pipefail

              rm -rf "$(functionPublishDirectory)"
              mkdir -p "$(functionPublishDirectory)"

              dotnet publish "$(functionProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore \
                --output "$(functionPublishDirectory)"
            displayName: Publish projection Function

          - task: ArchiveFiles@2
            displayName: Package projection Function
            inputs:
              rootFolderOrFile: '$(functionPublishDirectory)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(functionPackagePath)'
              replaceExistingArchive: true

          # ------------------------------------------------------------------
          # Publish pipeline artifacts
          # ------------------------------------------------------------------

          - task: PublishPipelineArtifact@1
            displayName: Publish API artifact
            inputs:
              targetPath: '$(apiPackagePath)'
              artifact: api
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Publish Function artifact
            inputs:
              targetPath: '$(functionPackagePath)'
              artifact: function
              publishLocation: pipeline

  # ==========================================================================
  # Deploy API
  # ==========================================================================

  - stage: DeployApi
    displayName: Deploy API
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployApiApplication
        displayName: Deploy Blast Planning API
        environment: 'event-sourcing-dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download API artifact
                  inputs:
                    artifactName: api
                    targetPath: '$(Pipeline.Workspace)/api'

                - task: AzureWebApp@1
                  displayName: Deploy API to Linux App Service
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: webAppLinux
                    appName: '$(apiAppName)'
                    package: '$(Pipeline.Workspace)/api/api.zip'
                    deploymentMethod: zipDeploy

  # ==========================================================================
  # Deploy projection worker
  # ==========================================================================

  - stage: DeployFunction
    displayName: Deploy projection Function
    dependsOn: DeployApi
    condition: succeeded()

    jobs:
      - deployment: DeployProjectionFunction
        displayName: Deploy projection Function
        environment: 'event-sourcing-dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download Function artifact
                  inputs:
                    artifactName: function
                    targetPath: '$(Pipeline.Workspace)/function'

                - task: AzureFunctionApp@2
                  displayName: Deploy Function App
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: functionAppLinux
                    appName: '$(functionAppName)'
                    package: '$(Pipeline.Workspace)/function/function.zip'
                    deploymentMethod: zipDeploy

  # ==========================================================================
  # Verify
  # ==========================================================================

  - stage: Verify
    displayName: Verify deployment
    dependsOn: DeployFunction
    condition: succeeded()

    jobs:
      - job: VerifyApplications
        displayName: Verify App Services

        steps:
          - checkout: none

          - task: AzureCLI@2
            displayName: Verify API and worker hosts
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "API App Service:"
                az webapp show \
                  --name "$(apiAppName)" \
                  --resource-group "rg-event-sourcing-dev" \
                  --query "{name:name,state:state,host:defaultHostName}" \
                  --output table

                echo "Function app:"
                az webapp show \
                  --name "$(functionAppName)" \
                  --resource-group "rg-event-sourcing-dev" \
                  --output table
