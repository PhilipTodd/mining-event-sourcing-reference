name: deploy-event-sourcing-app-dev-$(Date:yyyyMMdd)-$(Rev:r)

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-esr-dev'

  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.x'

  apiProject: 'src/backend/services/blast-planning/BlastPlanning.Api/BlastPlanning.Api.csproj'
  workerProject: 'src/backend/workers/BlastPlanning.ProjectionWorker/BlastPlanning.ProjectionWorker.csproj'

  apiAppName: 'api-adt-blastplanning-dev'
  workerAppName: 'worker-adt-blastplanning-dev'

  webJobName: 'BlastPlanning.ProjectionWorker'

  apiPublishDirectory: '$(Build.ArtifactStagingDirectory)/api/publish'
  apiPackagePath: '$(Build.ArtifactStagingDirectory)/api/api.zip'

  workerPublishDirectory: '$(Build.ArtifactStagingDirectory)/worker/publish'
  workerPackageRoot: '$(Build.ArtifactStagingDirectory)/worker/package'
  workerPackagePath: '$(Build.ArtifactStagingDirectory)/worker/worker.zip'

stages:

  # ==========================================================================
  # Build and test
  # ==========================================================================

  - stage: Build
    displayName: Build and test

    jobs:
      - job: BuildApplications
        displayName: Build API and projection worker

        steps:
          - checkout: self
            clean: true

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: '$(dotnetSdkVersion)'

          - script: |
              dotnet --info
            displayName: Show .NET environment

          - script: |
              dotnet restore "$(apiProject)"
              dotnet restore "$(workerProject)"
            displayName: Restore dependencies

          - script: |
              dotnet build "$(apiProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore

              dotnet build "$(workerProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore
            displayName: Build applications

          - script: |
              set -euo pipefail

              test_projects=$(find tests \
                -type f \
                \( -name "*Tests.csproj" -o -name "*.Tests.csproj" \))

              if [ -z "$test_projects" ]; then
                echo "No test projects were found."
                exit 1
              fi

              while IFS= read -r project; do
                echo "Testing $project"

                dotnet test "$project" \
                  --configuration "$(buildConfiguration)" \
                  --logger "trx" \
                  --results-directory "$(Agent.TempDirectory)/TestResults"
              done <<< "$test_projects"
            displayName: Run tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              failTaskOnFailedTests: true

          # ------------------------------------------------------------------
          # Publish API
          # ------------------------------------------------------------------

          - script: |
              set -euo pipefail

              rm -rf "$(apiPublishDirectory)"
              mkdir -p "$(apiPublishDirectory)"

              dotnet publish "$(apiProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore \
                --output "$(apiPublishDirectory)"
            displayName: Publish API

          - task: ArchiveFiles@2
            displayName: Package API
            inputs:
              rootFolderOrFile: '$(apiPublishDirectory)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(apiPackagePath)'
              replaceExistingArchive: true

          # ------------------------------------------------------------------
          # Publish projection worker as continuous WebJob
          # ------------------------------------------------------------------

          - script: |
              set -euo pipefail

              rm -rf "$(workerPublishDirectory)"
              rm -rf "$(workerPackageRoot)"

              mkdir -p "$(workerPublishDirectory)"

              dotnet publish "$(workerProject)" \
                --configuration "$(buildConfiguration)" \
                --no-restore \
                --output "$(workerPublishDirectory)"

              webjob_directory="$(workerPackageRoot)/App_Data/jobs/continuous/$(webJobName)"

              mkdir -p "$webjob_directory"

              cp -R "$(workerPublishDirectory)/." "$webjob_directory/"

              cat > "$webjob_directory/run.sh" <<'EOF'
              #!/usr/bin/env bash
              set -e

              cd "$(dirname "$0")"
              exec dotnet BlastPlanning.ProjectionWorker.dll
              EOF

              chmod +x "$webjob_directory/run.sh"

              echo "WebJob package contents:"
              find "$(workerPackageRoot)" -maxdepth 6 -type f | sort
            displayName: Prepare continuous WebJob

          - task: ArchiveFiles@2
            displayName: Package projection WebJob
            inputs:
              rootFolderOrFile: '$(workerPackageRoot)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(workerPackagePath)'
              replaceExistingArchive: true

          # ------------------------------------------------------------------
          # Publish pipeline artifacts
          # ------------------------------------------------------------------

          - task: PublishPipelineArtifact@1
            displayName: Publish API artifact
            inputs:
              targetPath: '$(apiPackagePath)'
              artifact: api
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Publish worker artifact
            inputs:
              targetPath: '$(workerPackagePath)'
              artifact: worker
              publishLocation: pipeline

  # ==========================================================================
  # Deploy API
  # ==========================================================================

  - stage: DeployApi
    displayName: Deploy API
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployApiApplication
        displayName: Deploy Blast Planning API
        environment: 'event-sourcing-dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download API artifact
                  inputs:
                    artifactName: api
                    targetPath: '$(Pipeline.Workspace)/api'

                - task: AzureWebApp@1
                  displayName: Deploy API to Linux App Service
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: webAppLinux
                    appName: '$(apiAppName)'
                    package: '$(Pipeline.Workspace)/api/api.zip'
                    deploymentMethod: zipDeploy

  # ==========================================================================
  # Deploy projection worker
  # ==========================================================================

  - stage: DeployWorker
    displayName: Deploy projection worker
    dependsOn: DeployApi
    condition: succeeded()

    jobs:
      - deployment: DeployProjectionWorker
        displayName: Deploy projection WebJob
        environment: 'event-sourcing-dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download worker artifact
                  inputs:
                    artifactName: worker
                    targetPath: '$(Pipeline.Workspace)/worker'

                - task: AzureWebApp@1
                  displayName: Deploy worker host package
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: webAppLinux
                    appName: '$(workerAppName)'
                    package: '$(Pipeline.Workspace)/worker/worker.zip'
                    deploymentMethod: zipDeploy

  # ==========================================================================
  # Verify
  # ==========================================================================

  - stage: Verify
    displayName: Verify deployment
    dependsOn: DeployWorker
    condition: succeeded()

    jobs:
      - job: VerifyApplications
        displayName: Verify App Services

        steps:
          - checkout: none

          - task: AzureCLI@2
            displayName: Verify API and worker hosts
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "API App Service:"
                az webapp show \
                  --name "$(apiAppName)" \
                  --resource-group "rg-event-sourcing-dev" \
                  --query "{name:name,state:state,host:defaultHostName}" \
                  --output table

                echo "Worker App Service:"
                az webapp show \
                  --name "$(workerAppName)" \
                  --resource-group "rg-event-sourcing-dev" \
                  --query "{name:name,state:state,host:defaultHostName}" \
                  --output table
